<style>
  /* Real Windows 98 system font (MS Sans Serif) */
  @font-face {
    font-family: "Pixelated MS Sans Serif";
    src: url("https://cdn.jsdelivr.net/npm/98.css/dist/ms_sans_serif.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Pixelated MS Sans Serif";
    src: url("https://cdn.jsdelivr.net/npm/98.css/dist/ms_sans_serif_bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  :root {
    --gray: #c0c0c0;
    --gray-2: #dfdfdf;
    --gray-3: #808080;
    --white: #ffffff;
    --black: #000000;
    --teal: #008080;
    --blue: #000080;
    --blue-light: #1084d0;
    --select: #000080;
    --select-text: #ffffff;
    --tb-h: 28px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height:100%; height:100dvh; overflow:hidden;
    position:fixed; inset:0; overscroll-behavior:none;
    touch-action: manipulation;
  }
  body {
    font-family: "Pixelated MS Sans Serif", "MS Sans Serif", Tahoma, Geneva, sans-serif;
    font-size: 11px;
    color:#000;
    background: var(--teal);
    user-select:none; -webkit-user-select:none;
    -webkit-text-size-adjust: 100%;
    cursor: default;
  }
  /* ===== Text selection — allow copy/paste inside content areas ===== */
  input, textarea, [contenteditable="true"],
  .term .line, .term, .notepad textarea,
  .ide .editor textarea, .ide .console, .ide .editor .gutter,
  .calc .disp, .arc table, .arc td, .arc th,
  .about-hero ~ div, .center-pane, .center-pane *,
  .browser iframe, .explorer .grid .item .lbl,
  .dialog .row, .dialog .row * {
    user-select: text; -webkit-user-select: text;
    cursor: text;
  }
  input, textarea { cursor: text; }
  .term .cur input.cmd { cursor: text; }
  ::selection { background: var(--blue); color: #fff; }
  button, input, textarea { font: inherit; }
  button { cursor:default; color:inherit; background:none; border:none; }
  img { -webkit-user-drag:none; user-drag:none; image-rendering: pixelated; }

  /* ===== Wallpaper ===== */
  #wallpaper { position:fixed; inset:0; z-index:0; background: var(--teal); }

  /* ===== Boot ===== */
  #boot {
    position:fixed; inset:0; background:#000; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; font-family: Arial, sans-serif;
    transition: opacity 0.5s;
  }
  #boot .logo { width:340px; height:auto; image-rendering:pixelated; }
  #boot .tag { margin-top:20px; font-size:13px; letter-spacing:2px; color:#bbb; }
  #boot .bar { margin-top:24px; width:300px; height:14px; border:1px solid #444; padding:2px; display:flex; gap:2px; }
  #boot .bar i { display:block; flex:1; background:#0a3; opacity:0; }

  /* ===== Shutdown ===== */
  #shutdown {
    position:fixed; inset:0; background:#000; z-index:10000; display:none;
    align-items:center; justify-content:center; padding:30px;
    color:#e87000; font-family:"Courier New", monospace; font-size:22px; text-align:center;
  }

  /* ===== Desktop ===== */
  #desktop {
    position:fixed; left:0; right:0; top:0; bottom: calc(var(--tb-h) + var(--safe-bottom));
    z-index:1; overflow:hidden; background: var(--teal);
  }
  .desk-icon {
    position:absolute; width:76px; padding:4px 2px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    text-align:center; color:#fff;
  }
  .desk-icon .pic { width:32px; height:32px; pointer-events:none; }
  .desk-icon .lbl {
    font-size:11px; padding:1px 3px; line-height:1.2; pointer-events:none;
    text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
    word-break: break-word;
  }
  .desk-icon.selected .lbl {
    background: var(--blue); color:#fff; text-shadow:none;
    outline:1px dotted #fff; outline-offset:-1px;
  }
  .desk-icon.selected .pic { filter: brightness(0.7) sepia(1) hue-rotate(190deg) saturate(8); }
  #selrect { position:absolute; border:1px dotted #fff; background:rgba(255,255,255,0.08); pointer-events:none; display:none; }

  /* ===== Bevel utility classes ===== */
  /* Standard "outset" (raised) bevel — like buttons, windows */
  .bev-out {
    border:2px solid;
    border-color: var(--gray-2) var(--black) var(--black) var(--gray-2);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--white);
  }
  .bev-in {
    border:2px solid;
    border-color: var(--gray-3) var(--white) var(--white) var(--gray-3);
    box-shadow: inset 1px 1px 0 var(--black);
  }
  .bev-out-thin {
    border:1px solid;
    border-color: var(--white) var(--black) var(--black) var(--white);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2);
  }

  /* ===== Windows ===== */
  .win {
    position:absolute;
    background: var(--gray);
    border:2px solid;
    border-color: var(--gray-2) var(--black) var(--black) var(--gray-2);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--white);
    display:flex; flex-direction:column;
    min-width:220px; min-height:120px;
    color:#000;
  }
  .win .titlebar {
    background: linear-gradient(90deg, #7f7f7f 0%, #b5b5b5 100%);
    color:#fff; font-weight:bold;
    height:20px; padding:2px 2px 2px 4px;
    display:flex; align-items:center; gap:4px;
    flex-shrink:0;
    touch-action: none;
  }
  .win.focused .titlebar { background: linear-gradient(90deg, var(--blue) 0%, var(--blue-light) 100%); }
  .win .titlebar .ico { width:14px; height:14px; flex-shrink:0; }
  .win .titlebar .ttl { flex:1; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .win .titlebar .ctrls { display:flex; gap:2px; }
  .tbtn {
    width:16px; height:14px; background: var(--gray); color:#000;
    border:1px solid;
    border-color: var(--white) var(--black) var(--black) var(--white);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2);
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; padding:0; flex-shrink:0;
    font-family: "Marlett", "Pixelated MS Sans Serif", sans-serif; font-size:8px;
  }
  .tbtn:active { border-color: var(--black) var(--white) var(--white) var(--black); box-shadow: inset 1px 1px 0 var(--gray-3); }
  .win .body { flex:1; overflow:auto; background:#fff; min-height:0; -webkit-overflow-scrolling: touch; }
  .win.maximized { left:0 !important; top:0 !important; width:100% !important; height: calc(100% - var(--tb-h) - var(--safe-bottom)) !important; }

  /* resize grips */
  .resize { position:absolute; z-index:2; }
  .resize.n { top:-3px; left:8px; right:8px; height:6px; cursor:n-resize; }
  .resize.s { bottom:-3px; left:8px; right:8px; height:6px; cursor:s-resize; }
  .resize.e { right:-3px; top:8px; bottom:8px; width:6px; cursor:e-resize; }
  .resize.w { left:-3px; top:8px; bottom:8px; width:6px; cursor:w-resize; }
  .resize.ne{ right:-3px; top:-3px; width:10px; height:10px; cursor:ne-resize; }
  .resize.nw{ left:-3px;  top:-3px; width:10px; height:10px; cursor:nw-resize; }
  .resize.se{ right:-3px; bottom:-3px; width:14px; height:14px; cursor:se-resize; }
  .resize.sw{ left:-3px;  bottom:-3px; width:10px; height:10px; cursor:sw-resize; }

  /* ===== Common UI ===== */
  .menubar {
    background: var(--gray); padding:2px 4px; display:flex; gap:1px;
    border-bottom:1px solid var(--gray-3);
  }
  .menubar span { padding:2px 6px; cursor:default; font-size:11px; }
  .menubar span:hover { background: var(--blue); color:#fff; }
  .statusbar {
    background: var(--gray); padding:2px 4px; border-top:1px solid var(--white);
    box-shadow: inset 0 1px 0 var(--gray-3);
    display:flex; gap:4px; font-size:11px; height:18px; align-items:center; flex-shrink:0;
  }
  .statusbar .seg {
    border:1px solid; border-color: var(--gray-3) var(--white) var(--white) var(--gray-3);
    padding:0 6px; flex:1; height:14px; display:flex; align-items:center;
  }
  .btn {
    background: var(--gray); padding:3px 14px; min-width:75px;
    border:1px solid; border-color: var(--white) var(--black) var(--black) var(--white);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2);
    font: inherit; color:#000; min-height: 22px;
  }
  .btn:active { border-color: var(--black) var(--white) var(--white) var(--black); box-shadow: inset 1px 1px 0 var(--gray-3); padding:4px 13px 2px 15px; }
  .btn.primary { outline:1px solid #000; outline-offset:-3px; }
  input[type=text], textarea, select, .field {
    background:#fff;
    border:1px solid; border-color: var(--gray-3) var(--white) var(--white) var(--gray-3);
    box-shadow: inset 1px 1px 0 #000;
    padding:2px 4px; font: inherit; color:#000;
  }
  input:focus, textarea:focus { outline:none; }
  textarea { resize:none; }

  /* ===== Taskbar ===== */
  #taskbar {
    position:fixed; left:0; right:0; bottom:0; height: calc(var(--tb-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    background: var(--gray);
    border-top:2px solid var(--white);
    box-shadow: inset 0 1px 0 var(--gray-2);
    display:flex; align-items:center; gap:3px; padding-left:2px; padding-right:2px;
    z-index:4000;
  }
  #start {
    height:22px; padding:0 6px 0 4px;
    display:flex; align-items:center; gap:4px; font-weight:bold; font-size:11px;
    background: var(--gray);
    border:1px solid; border-color: var(--white) var(--black) var(--black) var(--white);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2);
    flex-shrink:0;
  }
  #start.active, #start:active {
    border-color: var(--black) var(--white) var(--white) var(--black);
    box-shadow: inset 1px 1px 0 var(--gray-3);
    padding:1px 5px 0 5px;
  }
  #start .flag { width:16px; height:16px; flex-shrink:0; image-rendering:pixelated; }
  .tb-div { width:2px; height:22px; background: var(--gray-3); box-shadow: 1px 0 0 var(--white); margin:0 2px; flex-shrink:0; }
  .quick { display:flex; gap:2px; flex-shrink:0; }
  .quick button {
    width:22px; height:22px; background: var(--gray);
    border:1px solid transparent; padding:0; display:flex; align-items:center; justify-content:center;
  }
  .quick button:hover, .quick button:active { border-color: var(--white) var(--black) var(--black) var(--white); }
  .quick img { width:16px; height:16px; image-rendering:pixelated; }
  #tasks { flex:1; display:flex; gap:3px; overflow:hidden; margin:0 4px; }
  .task {
    height:22px; min-width:110px; max-width:160px; padding:0 6px;
    display:flex; align-items:center; gap:4px;
    background: var(--gray); font-size:11px;
    border:1px solid; border-color: var(--white) var(--black) var(--black) var(--white);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2);
    white-space:nowrap; overflow:hidden; flex:0 1 auto;
  }
  .task.active {
    border-color: var(--black) var(--white) var(--white) var(--black);
    box-shadow: inset 1px 1px 0 var(--gray-3);
    background:repeating-linear-gradient(45deg, var(--gray) 0 2px, #a0a0a0 2px 4px);
    padding:1px 5px 0 7px; font-weight:bold;
  }
  .task .ico { width:14px; height:14px; flex-shrink:0; }
  .task .lbl { flex:1; overflow:hidden; text-overflow:ellipsis; }
  #tray {
    height:22px; padding:0 6px 0 4px;
    display:flex; align-items:center; gap:6px; flex-shrink:0;
    border:1px solid; border-color: var(--gray-3) var(--white) var(--white) var(--gray-3);
  }
  #tray img { width:16px; height:16px; image-rendering:pixelated; }
  #clock { min-width:70px; text-align:center; font-size:11px; cursor:default; font-variant-numeric: tabular-nums; }

  /* ===== Start menu ===== */
  #startmenu {
    position:fixed; bottom: calc(var(--tb-h) + var(--safe-bottom)); left:2px;
    width:240px; max-height: calc(100dvh - var(--tb-h) - var(--safe-bottom) - 4px);
    background: var(--gray);
    border:2px solid; border-color: var(--gray-2) var(--black) var(--black) var(--gray-2);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--white);
    display:none; z-index:5500; padding:2px;
  }
  #startmenu.open { display:flex; }
  #startmenu .banner {
    width:24px; background:linear-gradient(180deg, var(--blue), #0a0a40);
    color: var(--gray); font-weight:bold; font-size:18px; padding:8px 3px;
    writing-mode: vertical-rl; transform: rotate(180deg);
    text-align:right; font-family: Arial, sans-serif; flex-shrink:0;
  }
  #startmenu .banner b { color:#fff; }
  #startmenu .items { flex:1; padding:2px 0; overflow:auto; -webkit-overflow-scrolling:touch; }
  #startmenu .items > div {
    display:flex; align-items:center; gap:8px;
    padding:5px 18px 5px 4px; position:relative; font-size:13px;
  }
  #startmenu .items > div:hover, #startmenu .items > div:active { background: var(--blue); color:#fff; }
  #startmenu .items > div .ico { width:24px; height:24px; flex-shrink:0; }
  #startmenu .items > div.sep {
    height:6px; padding:0; border-top:1px solid var(--gray-3);
    box-shadow: 0 1px 0 var(--white) inset; margin: 2px 2px; pointer-events:none;
  }
  #startmenu .items > div .arrow { position:absolute; right:4px; font-family:"Marlett", sans-serif; font-size:10px; }

  .submenu {
    position:fixed; background: var(--gray);
    border:2px solid; border-color: var(--gray-2) var(--black) var(--black) var(--gray-2);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--white);
    padding:2px; min-width:180px; z-index:5600;
  }
  .submenu div {
    display:flex; align-items:center; gap:8px;
    padding:5px 18px 5px 4px; font-size:13px; position:relative;
  }
  .submenu div:hover, .submenu div:active { background: var(--blue); color:#fff; }
  .submenu div .ico { width:16px; height:16px; flex-shrink:0; }
  .submenu div.sep { height:6px; padding:0; border-top:1px solid var(--gray-3);
    box-shadow:0 1px 0 var(--white) inset; margin:2px 2px; pointer-events:none; }

  /* ===== Context menu ===== */
  .ctxmenu {
    position:fixed; min-width:170px; background: var(--gray);
    border:2px solid; border-color: var(--gray-2) var(--black) var(--black) var(--gray-2);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--white);
    padding:2px; z-index:6000; font-size:11px;
  }
  .ctxmenu ul { list-style:none; }
  .ctxmenu li {
    padding:4px 18px 4px 22px; position:relative; min-height:22px;
  }
  .ctxmenu li:hover:not(.disabled):not(.sep), .ctxmenu li:active:not(.disabled):not(.sep) { background: var(--blue); color:#fff; }
  .ctxmenu li.disabled { color: var(--gray-3); text-shadow: 1px 1px 0 var(--white); }
  .ctxmenu li.sep { height:6px; padding:0; border-top:1px solid var(--gray-3);
    box-shadow: 0 1px 0 var(--white) inset; margin: 2px 2px; pointer-events:none; }
  .ctxmenu li b { font-weight:bold; }

  /* ===== Explorer ===== */
  .explorer { display:flex; flex-direction:column; height:100%; background:#fff; color:#000; }
  .explorer .toolbar { background: var(--gray); padding:3px; display:flex; gap:2px; flex-wrap:wrap; border-bottom:1px solid var(--gray-3); }
  .explorer .toolbar button {
    background: var(--gray); padding:2px 8px; min-width:40px;
    border:1px solid transparent; display:flex; align-items:center; gap:3px; font-size:11px; min-height:24px;
  }
  .explorer .toolbar button:hover, .explorer .toolbar button:active { border-color: var(--white) var(--black) var(--black) var(--white); box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2); }
  .explorer .addr { background: var(--gray); padding:3px; display:flex; gap:4px; align-items:center; border-bottom:1px solid var(--gray-3); }
  .explorer .addr label { font-size:11px; }
  .explorer .addr input { flex:1; }
  .explorer .grid {
    flex:1; overflow:auto; padding:8px; background:#fff;
    display:grid; grid-template-columns: repeat(auto-fill, 84px); gap:8px; align-content:start;
  }
  .explorer .grid .item {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    width:84px; padding:2px; text-align:center; word-break:break-word; font-size:11px;
  }
  .explorer .grid .item img { width:32px; height:32px; image-rendering:pixelated; }
  .explorer .grid .item.selected .lbl { background: var(--blue); color:#fff; outline:1px dotted #fff; outline-offset:-1px; }

  /* ===== Notepad ===== */
  .notepad { display:flex; flex-direction:column; height:100%; background:#fff; }
  .notepad textarea {
    flex:1; border:none; box-shadow:none; padding:4px 6px;
    font-family: "Lucida Console", "Courier New", monospace; font-size:12px;
    background:#fff; color:#000;
  }

  /* ===== Calculator ===== */
  .calc { padding:6px; background: var(--gray); height:100%; display:flex; flex-direction:column; gap:4px; }
  .calc .menu { font-size:11px; padding:0 4px 2px; }
  .calc .disp {
    background:#fff; padding:4px 6px; text-align:right; min-height:28px;
    border:1px solid; border-color: var(--gray-3) var(--white) var(--white) var(--gray-3);
    box-shadow: inset 1px 1px 0 #000;
    font-family:"Lucida Console", monospace; font-size:18px;
  }
  .calc .keys { display:grid; grid-template-columns: repeat(5, 1fr); gap:3px; flex:1; }
  .calc .keys .btn { min-width:0; padding:8px 0; font-weight:bold; font-size:13px; min-height:34px; }
  .calc .keys .op { color:#a00; }
  .calc .keys .eq { color:#a00; }
  .calc .keys .mem { color:#a00; }

  /* ===== Paint ===== */
  .paint { display:flex; height:100%; background: var(--gray); }
  .paint .tools {
    width:50px; padding:4px; display:grid; grid-template-columns:1fr 1fr; gap:2px; align-content:start;
    border-right:1px solid var(--gray-3); flex-shrink:0;
  }
  .paint .tools .t {
    width:22px; height:22px; background: var(--gray); font-size:11px;
    border:1px solid; border-color: var(--white) var(--black) var(--black) var(--white);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2);
    display:flex; align-items:center; justify-content:center;
  }
  .paint .tools .t.active {
    border-color: var(--black) var(--white) var(--white) var(--black);
    box-shadow: inset 1px 1px 0 var(--gray-3);
    background: repeating-linear-gradient(45deg, var(--gray) 0 2px, #a0a0a0 2px 4px);
  }
  .paint .right-pane { flex:1; display:flex; flex-direction:column; min-width:0; }
  .paint .canvas-wrap { flex:1; overflow:auto; padding:4px; background:#808080; -webkit-overflow-scrolling:touch; }
  .paint canvas {
    background:#fff; display:block; cursor:crosshair;
    border:1px solid; border-color: var(--gray-3) var(--white) var(--white) var(--gray-3);
    box-shadow: inset 1px 1px 0 #000;
    touch-action: none;
  }
  .paint .palette {
    background: var(--gray); border-top:1px solid var(--gray-3); padding:4px;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  .paint .palette .swatches { display:grid; grid-template-columns: repeat(8, 16px); grid-template-rows: repeat(2, 16px); gap:1px; }
  .paint .palette .sw { width:16px; height:16px; border:1px solid #000; }
  .paint .palette .sw.active { outline:2px solid yellow; }
  .paint .palette .current { width:24px; height:14px; border:1px solid #000; background:#000; }

  /* ===== Browser (Internet Explorer) ===== */
  .browser { display:flex; flex-direction:column; height:100%; background: var(--gray); }
  .browser .toolbar {
    background: var(--gray); padding:3px; display:flex; gap:2px; align-items:center; border-bottom:1px solid var(--gray-3);
  }
  .browser .toolbar button {
    background: var(--gray); padding:2px 8px; border:1px solid transparent;
    display:flex; align-items:center; gap:3px; font-size:11px; min-height:24px;
  }
  .browser .toolbar button:hover, .browser .toolbar button:active { border-color: var(--white) var(--black) var(--black) var(--white); box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2); }
  .browser .addr { background: var(--gray); padding:3px; display:flex; gap:4px; align-items:center; border-bottom:1px solid var(--gray-3); }
  .browser .addr label { font-size:11px; padding:0 4px; }
  .browser .addr input { flex:1; min-width:0; }
  .browser iframe { flex:1; border:none; background:#fff; }

  /* ===== Terminal / CMD ===== */
  .term {
    height:100%; background:#000; color:#c0c0c0;
    font-family:"Lucida Console","Courier New", monospace; font-size:13px;
    padding:8px; overflow:auto; line-height:1.4; -webkit-overflow-scrolling:touch;
  }
  .term .line { white-space:pre-wrap; word-break:break-word; }
  .term .err { color:#ff5555; }
  .term .ok { color:#55ff55; }
  .term .prompt { color:#fff; }
  .term .cur { display:flex; gap:4px; align-items:center; }
  .term input.cmd { background:transparent; border:none; outline:none; color:inherit; font:inherit; flex:1; padding:0; }

  /* ===== Mines ===== */
  .mines { padding:6px; background: var(--gray); }
  .mines .top {
    margin-bottom:6px; padding:4px;
    border:2px solid; border-color: var(--gray-3) var(--white) var(--white) var(--gray-3);
    display:flex; justify-content:space-between; align-items:center;
  }
  .mines .lcd {
    background:#000; color:#f00; font-family:"Lucida Console", monospace;
    font-weight:bold; font-size:22px; padding:0 4px; min-width:46px; text-align:right; border:1px solid #555;
  }
  .mines .face {
    width:30px; height:30px; background: var(--gray);
    border:2px solid; border-color: var(--white) var(--black) var(--black) var(--white);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .mines .face:active { border-color: var(--black) var(--white) var(--white) var(--black); }
  .mines .grid {
    display:grid; gap:0;
    border:3px solid; border-color: var(--gray-3) var(--white) var(--white) var(--gray-3);
    padding:0; touch-action: manipulation;
  }
  .mines .cell {
    width:18px; height:18px; background:#bdbdbd;
    border:2px solid; border-color: var(--white) #7b7b7b #7b7b7b var(--white);
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:12px; font-family:"Lucida Console", monospace;
  }
  .mines .cell.opened { border:1px solid var(--gray-3); }
  .mines .cell.bomb { background:#f00; }
  .mines .cell[data-n="1"]{ color:#0000ff; }
  .mines .cell[data-n="2"]{ color:#008000; }
  .mines .cell[data-n="3"]{ color:#ff0000; }
  .mines .cell[data-n="4"]{ color:#000080; }
  .mines .cell[data-n="5"]{ color:#800000; }
  .mines .cell[data-n="6"]{ color:#008080; }
  .mines .cell[data-n="7"]{ color:#000; }
  .mines .cell[data-n="8"]{ color:#808080; }

  /* ===== Snake ===== */
  .snake { padding:8px; background: var(--gray); height:100%; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .snake .info { font-size:13px; font-weight:bold; }
  .snake canvas { background:#000; border:2px solid; border-color: var(--gray-3) var(--white) var(--white) var(--gray-3); box-shadow: inset 1px 1px 0 #000; touch-action:none; max-width:100%; }
  .snake .pad { display:grid; grid-template-columns: 60px 60px 60px; gap:8px; width:auto; }
  .snake .pad button { padding:22px 0; font-size:24px; font-weight:bold; min-height:60px; }
  .snake .pad .blank { visibility:hidden; }

  /* ===== Solitaire ===== */
  .soli { padding:8px; background:#006400; height:100%; display:flex; flex-direction:column; gap:8px; overflow:auto; }
  .soli .menubar { background:var(--gray); border-bottom:1px solid var(--gray-3); }
  .soli .soli-top { display:flex; justify-content:space-between; padding:0 4px; gap:8px; }
  .soli .stock-area, .soli .found-area { display:flex; gap:8px; }
  .soli .tableau { display:grid; grid-template-columns:repeat(7, 60px); gap:8px; justify-content:center; padding:0 4px; }
  .soli .pile { width:60px; height:84px; position:relative; }
  .soli .pile.col { min-height:200px; }
  .soli .pile .empty { width:100%; height:100%; border:2px dashed rgba(255,255,255,0.3); border-radius:6px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.5); font-size:24px; }
  .soli .card { width:60px; height:84px; background:#fff; border:1px solid #000; border-radius:6px; padding:4px; box-shadow:1px 1px 2px rgba(0,0,0,0.4); cursor:pointer; user-select:none; }
  .soli .card.down { background: repeating-linear-gradient(45deg,#4a6cf7 0 4px,#3050d0 4px 8px); border-color:#000; }
  .soli .card.red { color:#cc0000; }
  .soli .card.black { color:#000; }
  .soli .card .ctop { font-weight:bold; font-size:12px; line-height:1; }
  .soli .card .cmid { text-align:center; font-size:24px; line-height:1; margin-top:8px; }
  .soli .cardpos { position:absolute; left:0; width:100%; }
  .soli .cardpos:hover .card { background:#ffffd0; }
  .soli .soli-info { color:#fff; font-size:12px; padding:0 8px; }
  @media(max-width:480px){
    .soli .tableau { grid-template-columns:repeat(7,42px); gap:4px; }
    .soli .pile, .soli .card { width:42px; height:60px; }
    .soli .card .cmid { font-size:18px; margin-top:4px; }
    .soli .card .ctop { font-size:10px; }
  }

  /* ===== Settings ===== */
  .settings { display:flex; height:100%; background: var(--gray); color:#000; }
  .settings .side { width:160px; border-right:1px solid var(--gray-3); padding:4px; overflow:auto; flex-shrink:0; }
  .settings .side .item {
    padding:6px 8px; font-size:12px; display:flex; align-items:center; gap:8px;
  }
  .settings .side .item:hover, .settings .side .item.active { background: var(--blue); color:#fff; }
  .settings .side .item img { width:16px; height:16px; }
  .settings .main { flex:1; padding:14px; overflow:auto; background:#fff; }
  .settings .main h1 { font-size:14px; margin-bottom:10px; }
  .settings .main h2 { font-size:12px; font-weight:bold; margin:10px 0 6px; }
  .settings .card {
    background: var(--gray); padding:8px 10px; margin-bottom:6px;
    border:2px solid; border-color: var(--gray-2) var(--black) var(--black) var(--gray-2);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--white);
    display:flex; align-items:center; gap:10px;
  }
  .settings .card img { width:24px; height:24px; }
  .settings .card .t { font-weight:bold; font-size:12px; }
  .settings .card .d { font-size:11px; color: #444; }
  .settings .card .grow { flex:1; }

  /* ===== Photos ===== */
  .photos { display:flex; flex-direction:column; height:100%; background:#000; }
  .photos .pview { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:4px; }
  .photos .pview canvas { max-width:100%; max-height:100%; }
  .photos .ctl { display:flex; justify-content:center; gap:6px; padding:6px; background: var(--gray); border-top:2px solid var(--white); box-shadow: inset 0 1px 0 var(--gray-2); }

  /* ===== Store ===== */
  .store { display:flex; flex-direction:column; height:100%; background: var(--gray); }
  .store .top { padding:8px; background: var(--gray); border-bottom:1px solid var(--gray-3); display:flex; gap:6px; align-items:center; }
  .store .top input { flex:1; }
  .store .body2 { flex:1; padding:10px; overflow:auto; background:#fff; }
  .store .hero {
    background: linear-gradient(135deg, #1e88e5, #6a3edb); padding:12px; color:#fff;
    border:1px solid #0a3a82; margin-bottom:10px;
  }
  .store .hero h2 { font-size:18px; }
  .store .hero p { font-size:11px; margin-top:4px; opacity:0.9; }
  .store .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .store .app {
    background: var(--gray); padding:8px;
    border:2px solid; border-color: var(--gray-2) var(--black) var(--black) var(--gray-2);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--white);
    display:flex; flex-direction:column; gap:4px; align-items:flex-start;
  }
  .store .app img { width:32px; height:32px; }
  .store .app .name { font-weight:bold; font-size:11px; }
  .store .app .pub { font-size:10px; color:#444; }

  /* ===== Java IDE ===== */
  .ide { display:flex; flex-direction:column; height:100%; background: var(--gray); }
  .ide .toolbar {
    background: var(--gray); padding:3px; display:flex; gap:4px; align-items:center;
    border-bottom:1px solid var(--gray-3); flex-wrap:wrap;
  }
  .ide .editor { flex:1; display:flex; min-height:0; background:#fff; }
  .ide .editor .gutter {
    background:#e0e0e0; color:#666; padding:4px 6px; text-align:right;
    font-family:"Lucida Console", monospace; font-size:12px;
    white-space:pre; user-select:none; border-right:1px solid var(--gray-3);
  }
  .ide .editor textarea {
    flex:1; border:none; box-shadow:none; background:#fff; color:#000;
    padding:4px 6px; font-family:"Lucida Console", monospace; font-size:12px; line-height:1.4;
  }
  .ide .console {
    height:120px; background:#000; color:#0f0; padding:6px 8px;
    font-family:"Lucida Console", monospace; font-size:11px; overflow:auto;
    border-top:1px solid var(--gray-3);
  }

  /* ===== Archive ===== */
  .arc { display:flex; flex-direction:column; height:100%; background:#fff; }
  .arc .toolbar { background: var(--gray); padding:3px; display:flex; gap:2px; flex-wrap:wrap; border-bottom:1px solid var(--gray-3); }
  .arc .toolbar .btn { padding:4px 10px; min-width:auto; font-size:11px; min-height:26px; }
  .arc .name { padding:4px 8px; background: var(--gray); border-bottom:1px solid var(--gray-3); font-size:11px; }
  .arc table { width:100%; border-collapse:collapse; font-size:11px; }
  .arc thead { background: var(--gray); }
  .arc th { text-align:left; padding:4px 8px; border:1px solid var(--gray-3); border-top:none; }
  .arc td { padding:4px 8px; border-bottom:1px solid #eee; }
  .arc td img { width:16px; height:16px; vertical-align:middle; margin-right:6px; }
  .arc tr:hover td { background: var(--blue); color:#fff; }

  /* ===== Dialog ===== */
  .dialog { padding:14px; display:flex; flex-direction:column; gap:14px; height:100%; box-sizing:border-box; background: var(--gray); }
  .dialog .row { display:flex; gap:12px; align-items:flex-start; flex:1; }
  .dialog .row img { width:32px; height:32px; flex-shrink:0; }
  .dialog .actions { display:flex; gap:6px; justify-content:center; }
  .dialog input[type=text] { width:100%; }

  /* ===== Generic center pane ===== */
  .center-pane { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; text-align:center; padding:20px; background: var(--gray); }
  .center-pane h2 { font-size:14px; font-weight:bold; }
  .center-pane p { font-size:11px; }
  .about-hero {
    background: linear-gradient(135deg, #4060ff, #7028b8 60%, #f04060);
    color:#fff; padding:14px; font-weight:bold; height:80px;
    display:flex; align-items:flex-end;
    font-family: Arial, sans-serif;
  }
  .about-hero b { font-size:22px; }

  /* ===== Toast ===== */
  #toast {
    position:fixed; right:8px; bottom: calc(var(--tb-h) + var(--safe-bottom) + 8px);
    background: var(--gray); padding:8px 14px; font-size:11px;
    border:2px solid; border-color: var(--gray-2) var(--black) var(--black) var(--gray-2);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--white), 2px 2px 4px rgba(0,0,0,0.4);
    z-index:7000; display:none; max-width:300px;
  }

  /* ===== Scrollbars ===== */
  ::-webkit-scrollbar { width:16px; height:16px; }
  ::-webkit-scrollbar-track { background: #d4d0c8; }
  ::-webkit-scrollbar-thumb {
    background: var(--gray);
    border:1px solid; border-color: var(--white) var(--black) var(--black) var(--white);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2);
  }
  ::-webkit-scrollbar-button {
    background: var(--gray); display:block; height:16px;
    border:1px solid; border-color: var(--white) var(--black) var(--black) var(--white);
    box-shadow: inset -1px -1px 0 var(--gray-3), inset 1px 1px 0 var(--gray-2);
  }

  /* ===== Performance hints ===== */
  .win { contain: layout style; will-change: transform; transform: translateZ(0); }
  .win .titlebar, .resize { will-change: transform; }
  #taskbar, #startmenu { contain: layout style; }

  /* ===== iOS: prevent input zoom (must be ≥16px on touch devices) ===== */
  @media (pointer: coarse) {
    input[type=text], input:not([type]), textarea, select, .field, .term input.cmd { font-size: 16px !important; }
    button { min-height: 32px; }
  }

  /* ===== TABLET (481-1024) ===== */
  @media (min-width: 481px) and (max-width: 1024px) {
    :root { --tb-h: 34px; }
    body { font-size: 12px; }
    .desk-icon { width: 80px; }
    .desk-icon .pic { width: 40px; height: 40px; }
    .desk-icon .lbl { font-size: 12px; }
    .win .titlebar { height: 26px; }
    .win .titlebar .ttl { font-size: 12px; }
    .tbtn { width: 22px; height: 20px; font-size: 10px; }
    #start { height: 28px; font-size: 12px; }
    .task { height: 28px; min-width: 140px; }
    .quick button { width: 28px; height: 28px; }
    .quick img { width: 18px; height: 18px; }
  }

  /* ===== PHONE (≤480) ===== */
  @media (max-width: 480px) {
    :root { --tb-h: 44px; }
    body { font-size: 12px; }
    .desk-icon { width: 68px; padding: 2px; }
    .desk-icon .pic { width: 38px; height: 38px; }
    .desk-icon .lbl { font-size: 11px; }

    .win {
      left: 0 !important; top: 0 !important;
      width: 100vw !important;
      height: calc(100dvh - var(--tb-h) - var(--safe-bottom)) !important;
      border: none; box-shadow: none;
      transform: none;
    }
    .win .titlebar { height: 34px; padding: calc(3px + var(--safe-top)) 4px 3px 10px; }
    .win .titlebar .ttl { font-size: 14px; }
    .tbtn { width: 32px; height: 28px; font-size: 12px; }
    .resize { display: none; }

    #taskbar { height: calc(var(--tb-h) + var(--safe-bottom)); }
    #start { height: 36px; font-size: 14px; padding: 0 12px 0 8px; }
    #start .flag { width: 20px; height: 20px; }
    .task { height: 36px; min-width: 0; max-width: 44px; font-size: 0; padding: 0; justify-content: center; }
    .task .ico { width: 22px; height: 22px; }
    .task .lbl { display: none; }
    .quick button { width: 38px; height: 36px; }
    .quick img { width: 22px; height: 22px; }
    .tb-div { display: none; }
    #tray { height: 36px; padding: 0 10px; gap: 8px; border: none; }
    #tray img { width: 20px; height: 20px; }
    #clock { font-size: 12px; font-weight: bold; min-width: 78px; }

    #startmenu { width: calc(100vw - 8px); max-width: none; bottom: calc(var(--tb-h) + var(--safe-bottom)); }
    #startmenu .banner { width: 28px; font-size: 16px; }
    #startmenu .items > div { padding: 12px 18px 12px 8px; font-size: 15px; min-height: 48px; }
    #startmenu .items > div .ico { width: 32px; height: 32px; }
    .submenu { width: calc(100vw - 8px); max-width: 280px; }
    .submenu div { padding: 12px 18px 12px 8px; font-size: 15px; min-height: 46px; }
    .ctxmenu { min-width: 200px; }
    .ctxmenu li { padding: 12px 18px 12px 24px; font-size: 14px; min-height: 44px; }

    .calc .keys .btn { min-height: 52px; font-size: 18px; }
    .calc .disp { font-size: 26px; min-height: 40px; }
    .calc { padding: 8px; gap: 6px; }
    .mines .cell { width: 26px; height: 26px; font-size: 15px; }
    .notepad textarea { font-size: 16px; padding: 10px; line-height: 1.5; }
    .term { font-size: 14px; padding: 10px; }
    .ide .editor textarea { font-size: 14px; }
    .ide .editor .gutter { font-size: 14px; padding: 4px 8px; }
    .ide .console { height: 100px; }

    .settings { flex-direction: column; }
    .settings .side { width: 100%; max-height: 140px; border-right: none; border-bottom: 1px solid var(--gray-3); display: flex; overflow-x: auto; }
    .settings .side .item { font-size: 13px; padding: 12px; min-height: 44px; white-space: nowrap; flex-shrink: 0; }
    .settings .main { padding: 12px; }

    .browser .toolbar button, .explorer .toolbar button { min-height: 38px; font-size: 13px; padding: 8px 12px; }
    .browser .addr, .explorer .addr { padding: 6px; gap: 6px; }
    .browser .addr input, .explorer .addr input { padding: 8px; }

    .paint .tools { width: 64px; }
    .paint .tools .t { width: 28px; height: 28px; }
    .paint .palette .sw { width: 20px; height: 20px; }
    .paint .palette .swatches { grid-template-columns: repeat(8, 20px); grid-template-rows: repeat(2, 20px); }

    .arc table { font-size: 12px; }
    .arc th, .arc td { padding: 6px 8px; }
    .arc .toolbar .btn { min-height: 36px; padding: 6px 12px; }

    .snake .pad button { padding: 20px 0; font-size: 22px; }
    .snake canvas { max-width: 100%; height: auto; }

    .explorer .grid { grid-template-columns: repeat(auto-fill, 76px); gap: 6px; padding: 6px; }

    .dialog { padding: 16px; }
    .dialog .actions .btn { min-height: 40px; min-width: 80px; }

    #boot .logo { width: 260px; }
    #boot .bar { width: 240px; }
    #boot .tag { font-size: 12px; letter-spacing: 1.5px; }
  }

  /* ===== Tiny phones (≤360) ===== */
  @media (max-width: 360px) {
    .desk-icon { width: 60px; padding: 1px; }
    .desk-icon .pic { width: 34px; height: 34px; }
    .desk-icon .lbl { font-size: 10px; }
    .calc .keys { gap: 2px; }
    .mines .cell { width: 22px; height: 22px; font-size: 13px; }
    .quick button { width: 34px; }
    #start span { display: none; }
    #boot .logo { width: 220px; }
  }

  /* ===== Landscape phone (short height) ===== */
  @media (max-height: 500px) and (orientation: landscape) {
    :root { --tb-h: 32px; }
    .win .titlebar { height: 26px; padding-top: 2px; }
    .tbtn { height: 22px; }
    .desk-icon { width: 64px; padding: 2px 0; }
    .desk-icon .pic { width: 28px; height: 28px; }
    .desk-icon .lbl { font-size: 10px; }
    #startmenu { max-height: calc(100dvh - var(--tb-h) - 4px); }
    .calc .keys .btn { min-height: 32px; font-size: 14px; }
    .ide .console { height: 70px; }
    .snake .pad { display: none; }
  }

  /* ===== Desktop only (hide mobile-only controls) ===== */
  @media (min-width: 821px) and (pointer: fine) {
    .snake .pad { display: none; }
  }

  /* ===== High-DPI / Retina: keep crisp pixel art ===== */
  @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
    img, .desk-icon .pic, #start .flag, .task .ico { image-rendering: pixelated; }
  }

  /* ===== Reduced motion ===== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ===== Print: hide UI chrome ===== */
  @media print { #taskbar, #startmenu, .win .titlebar { display: none !important; } }
</style>

<body>

<div id="wallpaper"></div>

<!-- Boot -->
<div id="boot">
  <svg class="logo" viewBox="0 0 340 110" xmlns="http://www.w3.org/2000/svg">

// ---------- Audio ----------
let audio = null;
let audioUnlocked = false;
let pendingChime = false;
function ensureAudio(){
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  }
  return audio;
}
function unlockAudio(){
  const a = ensureAudio(); if (!a) return;
  if (a.state === "suspended") a.resume().then(()=>{
    audioUnlocked = true;
    // Play a near-silent tone to satisfy iOS unlock requirements
    try {
      const o = a.createOscillator(), g = a.createGain();
      g.gain.value = 0.0001; o.frequency.value = 1; o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + 0.01);
    } catch{}
    if (pendingChime) { pendingChime = false; setTimeout(chime, 100); }
  }).catch(()=>{});
  else audioUnlocked = true;
}
function beep(freq=440, dur=0.08, type="square", vol=0.05){
  const a = ensureAudio(); if (!a) return;
  if (a.state === "suspended") { a.resume().catch(()=>{}); return; }
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(a.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.stop(a.currentTime + dur + 0.02);
  } catch(e){}
}
function chime(){
  const a = ensureAudio();
  if (!a || a.state === "suspended") { pendingChime = true; return; }
  const seq = [[523.25,0.18],[659.25,0.18],[783.99,0.22],[1046.5,0.45]];
  let t = 0;
  seq.forEach(([f,d]) => { setTimeout(()=> beep(f, d, "triangle", 0.06), t*1000); t += d*0.7; });
}
function ding(){ beep(880,0.12,"square",0.05); setTimeout(()=> beep(660,0.12,"square",0.05), 130); }
// Unlock audio on ANY user interaction (pointerdown, touchstart, keydown, click)
["pointerdown","touchstart","keydown","click"].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { once:true, passive:true, capture:true })
);

// ---------- Boot ----------
function boot(){
  const bars = document.querySelectorAll("#boot .bar i");
  let i = 0;
  const t = setInterval(() => {
    if (i < bars.length) { bars[i].style.opacity = 1; i++; }
    else {
      clearInterval(t);
      setTimeout(() => {
        const b = document.getElementById("boot");
        b.style.opacity = "0";
        setTimeout(() => { b.style.display = "none"; chime(); }, 500);
      }, 250);
    }
  }, 200);
}

// ---------- Clock ----------
function tick(){
  const el = document.getElementById("clock"); if (!el) return;
  const d = new Date();
  let h = d.getHours(); const m = String(d.getMinutes()).padStart(2,"0");
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  el.textContent = `${h}:${m} ${ampm}`;
  el.title = d.toLocaleString(undefined, { weekday:"long", year:"numeric", month:"long", day:"numeric", hour:"numeric", minute:"2-digit" });
}

// ---------- Desktop ----------
const DESKTOP_LIST = ["mycomputer","network","documents","recycle","edge","chrome","msn","outlook","notepad","wordpad","paint","calc","mines","solitaire","pinball","hearts","snake","pipes","flowerbox","v86","media","recorder","charmap","defrag","dialer","terminal","java","rar"];

function renderDesktop(){
  const desk = document.getElementById("desktop");
  const rowH = 80;
  const maxRows = Math.max(4, Math.floor((window.innerHeight - 40 - 50) / rowH));
  DESKTOP_LIST.forEach((id, i) => {
    const a = APPS[id]; if (!a) return;
    const col = Math.floor(i / maxRows);
    const row = i % maxRows;
    const el = document.createElement("div");
    el.className = "desk-icon"; el.dataset.id = id;
    el.style.left = (12 + col * 80) + "px";
    el.style.top  = (10 + row * rowH) + "px";
    el.innerHTML = `<img class="pic" src="${a.icon}" alt=""><div class="lbl">${a.name}</div>`;
    addOpenable(el, () => openApp(id));
    el.addEventListener("pointerdown", e => { e.stopPropagation(); clearSelected(); el.classList.add("selected"); });
    longPress(el, e => {
      clearSelected(); el.classList.add("selected");
      showCtx(e.clientX, e.clientY, [
        { label:"<b>Open</b>", action:()=>openApp(id) },
        { sep:true },
        { label:"Cut", disabled:true },
        { label:"Copy", disabled:true },
        { sep:true },
        { label:"Delete", action:()=>el.remove() },
        { label:"Rename", disabled:true },
        { sep:true },
        { label:"Properties", action:()=>aboutDialog(a.name, `Type: Shortcut\nLocation: Desktop\nSize: 1.24 KB`) },
      ]);
    });
    desk.appendChild(el);
  });
}
function clearSelected(){ document.querySelectorAll(".desk-icon.selected").forEach(x => x.classList.remove("selected")); }

function addOpenable(el, fn){
  if (IS_TOUCH) {
    el.addEventListener("click", e => { e.preventDefault(); fn(); });
  } else {
    el.addEventListener("dblclick", fn);
  }
}

function longPress(el, fn, ms=550){
  let t = null, startX=0, startY=0;
  el.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") return;
    startX = e.clientX; startY = e.clientY;
    t = setTimeout(() => fn(e), ms);
  });
  el.addEventListener("pointermove", e => { if (Math.hypot(e.clientX-startX, e.clientY-startY) > 8) { clearTimeout(t); t = null; }});
  el.addEventListener("pointerup", () => clearTimeout(t));
  el.addEventListener("pointercancel", () => clearTimeout(t));
  el.addEventListener("contextmenu", e => { e.preventDefault(); e.stopPropagation(); fn(e); });
}

// ---------- Window manager ----------
let zTop = 100;
const wins = new Map();
let winSeq = 0;

function focusWin(id){
  const w = wins.get(id); if (!w) return;
  zTop++; w.el.style.zIndex = zTop;
  wins.forEach(v => v.el.classList.remove("focused"));
  w.el.classList.add("focused");
  wins.forEach(v => v.taskBtn?.classList.remove("active"));
  w.taskBtn?.classList.add("active");
}

function makeWindow({ title, icon, w=520, h=380, x, y, content, app, resizable=true, minSize=[220,140] }){
  const id = "w"+(++winSeq);
  // Cap default size to viewport so windows fit on tablets/phones
  const maxW = window.innerWidth - 20;
  const maxH = window.innerHeight - parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tb-h")) - 20;
  w = Math.min(w, maxW); h = Math.min(h, maxH);
  if (x === undefined) x = Math.max(0, Math.min(maxW - w, 60 + (winSeq*22)%240));
  if (y === undefined) y = Math.max(0, Math.min(maxH - h, 40 + (winSeq*18)%160));

  const el = document.createElement("div");
  el.className = "win focused";
  el.style.left = x+"px"; el.style.top = y+"px";
  el.style.width = w+"px"; el.style.height = h+"px";
  el.dataset.id = id;
  el.innerHTML = `
    <div class="titlebar">
      <img class="ico" src="${icon||ICONS.txt}" alt="">
      <div class="ttl">${title}</div>
      <div class="ctrls">
        <button class="tbtn" data-act="min" title="Minimize">_</button>
        <button class="tbtn" data-act="max" title="Maximize">▢</button>
        <button class="tbtn" data-act="close" title="Close">×</button>
      </div>
    </div>
    <div class="body"></div>
  `;
  if (resizable && !IS_NARROW()){
    ["n","s","e","w","ne","nw","se","sw"].forEach(d => {
      const r = document.createElement("div"); r.className="resize "+d; r.dataset.dir=d;
      el.appendChild(r);
    });
  }
  const body = el.querySelector(".body");
  if (typeof content === "string") body.innerHTML = content; else if (content) body.appendChild(content);
  document.body.appendChild(el);

  // Taskbar button
  const tb = document.createElement("div");
  tb.className = "task active";
  tb.innerHTML = `<img class="ico" src="${icon||ICONS.txt}"><span class="lbl">${title}</span>`;
  document.getElementById("tasks").appendChild(tb);
  tb.addEventListener("click", () => {
    if (el.style.display === "none") { el.style.display = ""; focusWin(id); }
    else if (!el.classList.contains("focused")) focusWin(id);
    else { el.style.display = "none"; tb.classList.remove("active"); }
  });

  wins.set(id, { el, taskBtn:tb, app, title, minSize });

  el.addEventListener("pointerdown", () => focusWin(id), true);
  el.querySelector('[data-act="close"]').addEventListener("click", e => { e.stopPropagation(); closeWin(id); });
  el.querySelector('[data-act="min"]').addEventListener("click", e => { e.stopPropagation(); el.style.display="none"; tb.classList.remove("active"); });
  el.querySelector('[data-act="max"]').addEventListener("click", e => { e.stopPropagation(); el.classList.toggle("maximized"); });

  // Drag
  const tbar = el.querySelector(".titlebar");
  tbar.addEventListener("pointerdown", e => {
    if (e.target.closest(".ctrls")) return;
    if (IS_NARROW()) return;
    if (el.classList.contains("maximized")) el.classList.remove("maximized");
    e.preventDefault();
    tbar.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    const tbH = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--tb-h")) || 28;
    let raf = 0, pendX = 0, pendY = 0;
    function move(ev){
      pendX = Math.max(-r.width+80, Math.min(window.innerWidth-40, ev.clientX - ox));
      pendY = Math.max(0, Math.min(window.innerHeight - tbH - 24, ev.clientY - oy));
      if (raf) return;
      raf = requestAnimationFrame(() => { el.style.left = pendX+"px"; el.style.top = pendY+"px"; raf = 0; });
    }
    function up(){
      tbar.removeEventListener("pointermove",move); tbar.removeEventListener("pointerup",up); tbar.removeEventListener("pointercancel",up);
    }
    tbar.addEventListener("pointermove",move); tbar.addEventListener("pointerup",up); tbar.addEventListener("pointercancel",up);
  });
  tbar.addEventListener("dblclick", e => { if (!e.target.closest(".ctrls")) el.classList.toggle("maximized"); });

  // Resize
  el.querySelectorAll(".resize").forEach(g => {
    g.addEventListener("pointerdown", e => {
      if (el.classList.contains("maximized") || IS_NARROW()) return;
      e.preventDefault(); e.stopPropagation();
      g.setPointerCapture(e.pointerId);
      const dir = g.dataset.dir;
      const sx = e.clientX, sy = e.clientY;
      const r = el.getBoundingClientRect();
      const [minW,minH] = minSize;
      let raf2 = 0, st = {};
      function move(ev){
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        let nl = r.left, nt = r.top, nw = r.width, nh = r.height;
        if (dir.includes("e")) nw = Math.max(minW, r.width + dx);
        if (dir.includes("s")) nh = Math.max(minH, r.height + dy);
        if (dir.includes("w")) { nw = Math.max(minW, r.width - dx); nl = r.right - nw; }
        if (dir.includes("n")) { nh = Math.max(minH, r.height - dy); nt = r.bottom - nh; }
        st = { nl, nt, nw, nh };
        if (raf2) return;
        raf2 = requestAnimationFrame(() => { el.style.left = st.nl+"px"; el.style.top = st.nt+"px"; el.style.width = st.nw+"px"; el.style.height = st.nh+"px"; raf2 = 0; });
      }
      function up(){ g.removeEventListener("pointermove",move); g.removeEventListener("pointerup",up); g.removeEventListener("pointercancel",up); }
      g.addEventListener("pointermove",move); g.addEventListener("pointerup",up); g.addEventListener("pointercancel",up);
    });
  });

  focusWin(id);
  return { id, el, body };
}

function closeWin(id){
  const w = wins.get(id); if (!w) return;
  w.el.remove(); w.taskBtn?.remove(); wins.delete(id);
}

function openApp(id, arg){
  const a = APPS[id];
  if (!a) { errorDialog(`Cannot find '${id}'.`); return; }
  closeStart();
  a.launch(arg);
}

function openFolder(name, items, icon){
  const c = document.createElement("div");
  c.className = "explorer";
  c.innerHTML = `
    <div class="menubar"><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Help</span></div>
    <div class="toolbar">
      <button title="Back">← Back</button>
      <button title="Forward">→ Fwd</button>
      <button title="Up">↑ Up</button>
      <button>Cut</button><button>Copy</button><button>Paste</button>
    </div>
    <div class="addr"><label>Address</label><input type="text" value="${name}" readonly></div>
    <div class="grid"></div>
    <div class="statusbar"><div class="seg" id="fStat">${items.length} object(s)</div></div>
  `;
  const grid = c.querySelector(".grid");
  const addr = c.querySelector(".addr input");
  const stat = c.querySelector("#fStat");

  // History stack of folders [{name, items, icon}]
  const stack = [{ name, items, icon: icon || ICONS.folder }];
  let sIdx = 0;
  const backBtn = c.querySelector('button[title="Back"]');
  const fwdBtn = c.querySelector('button[title="Forward"]');
  const upBtn = c.querySelector('button[title="Up"]');
  function refreshNav(){
    backBtn.disabled = sIdx <= 0; backBtn.style.opacity = backBtn.disabled?0.5:1;
    fwdBtn.disabled = sIdx >= stack.length-1; fwdBtn.style.opacity = fwdBtn.disabled?0.5:1;
    upBtn.disabled = sIdx === 0; upBtn.style.opacity = upBtn.disabled?0.5:1;
  }
  function render(){
    const f = stack[sIdx];
    addr.value = f.name; stat.textContent = `${f.items.length} object(s)`;
    grid.innerHTML = "";
    grid.style.display = ""; grid.style.alignItems = ""; grid.style.justifyContent = ""; grid.style.color = "";
    if (!f.items.length) {
      grid.style.display = "flex"; grid.style.alignItems = "center"; grid.style.justifyContent = "center"; grid.style.color = "#666";
      grid.textContent = "(empty)";
      refreshNav(); return;
    }
    f.items.forEach(it => {
      const el = document.createElement("div"); el.className = "item";
      el.innerHTML = `<img src="${it.icon}"><div class="lbl">${it.name}</div>`;
      el.addEventListener("pointerdown", () => { c.querySelectorAll(".item.selected").forEach(x=>x.classList.remove("selected")); el.classList.add("selected"); });
      addOpenable(el, () => {
        if (it.subfolder) navigateTo(it.name, it.subfolder, it.icon);
        else if (it.action) it.action();
      });
      grid.appendChild(el);
    });
    refreshNav();
  }
  function navigateTo(name, items, icon){
    stack.splice(sIdx+1);
    stack.push({ name, items, icon: icon || ICONS.folder });
    sIdx = stack.length-1; render();
  }
  function back(){ if (sIdx>0){ sIdx--; render(); } }
  function forward(){ if (sIdx<stack.length-1){ sIdx++; render(); } }
  function up(){ if (sIdx>0){ sIdx = 0; stack.splice(1); render(); } }
  c.__nav = { back, forward, up };

  backBtn.addEventListener("click", back);
  fwdBtn.addEventListener("click", forward);
  upBtn.addEventListener("click", up);

  render();
  const w = makeWindow({ title:name, icon:icon||ICONS.folder, w:580, h:420, content:c });
  w.el.__nav = c.__nav;
  wireMenubar(c.querySelector(".menubar"), {
    File: [
      { label:"New ▸ Folder", action:()=>toast("New folder (demo)") },
      { label:"Properties", action:()=>aboutDialog(name+" Properties","Folder · "+stack[sIdx].items.length+" items") },
      { sep:true },
      { label:"Close", action:()=>closeWin(w.id) },
    ],
    Edit: [
      { label:"Select All", action:()=>c.querySelectorAll(".item").forEach(i=>i.classList.add("selected")) },
      { label:"Invert Selection", action:()=>c.querySelectorAll(".item").forEach(i=>i.classList.toggle("selected")) },
    ],
    View: [
      { label:"Large Icons", action:()=>grid.style.gridTemplateColumns="repeat(auto-fill,84px)" },
      { label:"List", action:()=>grid.style.gridTemplateColumns="1fr" },
      { sep:true },
      { label:"Refresh", action:render },
    ],
    Go: [
      { label:"Back", action:back },
      { label:"Forward", action:forward },
      { label:"Up One Level", action:up },
    ],
    Help: [
      { label:"Help Topics", action:()=>aboutDialog("Help","Alt+Left=Back  Alt+Right=Forward  Alt+Up=Parent") },
    ],
  });
}

  function openFile(){
    const inp = document.createElement("input"); inp.type="file"; inp.accept=".txt,text/plain,*";
    inp.onchange = e => { const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ ta.value=r.result; localStorage.setItem("np98",ta.value); }; r.readAsText(f); };

      { sep:true },
      { label:"Cut", action:()=>{ ta.focus(); document.execCommand("cut"); } },
      { label:"Copy", action:()=>{ ta.focus(); document.execCommand("copy"); } },
      { label:"Paste", action: async ()=>{ ta.focus(); try { const t=await navigator.clipboard.readText(); const s=ta.selectionStart,e=ta.selectionEnd; ta.value=ta.value.slice(0,s)+t+ta.value.slice(e); ta.selectionStart=ta.selectionEnd=s+t.length; localStorage.setItem("np98",ta.value); } catch{ document.execCommand("paste"); } } },
      { label:"Delete", action:()=>{ const s=ta.selectionStart,e=ta.selectionEnd; ta.value=ta.value.slice(0,s)+ta.value.slice(e); ta.setSelectionRange(s,s); } },
      { sep:true },
      { label:"Select All", action:()=>ta.select() },
      { label:"Time/Date", action:()=>{ const s=ta.selectionStart; const d=new Date().toLocaleString(); ta.value=ta.value.slice(0,s)+d+ta.value.slice(s); ta.setSelectionRange(s+d.length,s+d.length); } },
      { sep:true },
      { label:"Word Wrap", action:()=>{ ta.style.whiteSpace = ta.style.whiteSpace === "pre" ? "pre-wrap" : "pre"; } },
    ],

      { label:"Find Next", action: find },
      { label:"Replace...", action: replace },
      { label:"Go To...", action:()=>{ const n=+prompt("Line:"); if(n>0){ const lines=ta.value.split("\n").slice(0,n-1); const pos=lines.join("\n").length+(n>1?1:0); ta.focus(); ta.setSelectionRange(pos,pos); } } },
    ],
    Help: [
      { label:"Help Topics", action:()=>aboutDialog("Notepad Help","Ctrl+S to save · Ctrl+F to find\nWord Wrap toggles line wrapping") },
      { sep:true },
      { label:"About Notepad", action:()=>aboutDialog("About Notepad","Notepad — Windows 98 Web\nText editor for plain files") },
    ],
  });
  // Keyboard shortcuts inside notepad
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); localStorage.setItem("np98", ta.value); toast("Saved"); }
    else if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === "f") { e.preventDefault(); find(); }

  });
}

function appCalc(){
  const c = document.createElement("div");
  c.className = "calc";
  c.innerHTML = `
    <div class="menu">Edit  View  Help</div>
    <div class="disp" id="cDisp">0</div>
    <div class="keys">
      <button class="btn mem">MC</button><button class="btn mem">MR</button><button class="btn mem">MS</button><button class="btn mem">M+</button><button class="btn mem">M-</button>
      <button class="btn">7</button><button class="btn">8</button><button class="btn">9</button><button class="btn op">/</button><button class="btn op">√</button>
      <button class="btn">4</button><button class="btn">5</button><button class="btn">6</button><button class="btn op">*</button><button class="btn op">%</button>
      <button class="btn">1</button><button class="btn">2</button><button class="btn">3</button><button class="btn op">-</button><button class="btn op">1/x</button>
      <button class="btn">0</button><button class="btn">±</button><button class="btn">.</button><button class="btn op">+</button><button class="btn eq">=</button>
    </div>
  `;
  const disp = c.querySelector("#cDisp");
  let cur = "0", prev = null, op = null, justOp = false;
  function set(v){ cur = String(v); disp.textContent = cur.length>16 ? Number(cur).toExponential(8) : cur; }
  const opMap = { "+":(a,b)=>a+b, "-":(a,b)=>a-b, "*":(a,b)=>a*b, "/":(a,b)=> b===0 ? NaN : a/b };
  c.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const t = b.textContent.trim();
    if (/^[0-9]$/.test(t)) { if (cur==="0"||justOp){ cur=t; justOp=false; } else cur += t; set(cur); }
    else if (t === ".") { if (justOp){ cur="0."; justOp=false; } else if (!cur.includes(".")) cur += "."; set(cur); }
    else if (t === "±") set(parseFloat(cur)*-1);
    else if (t === "%") set(parseFloat(cur)/100);
    else if (t === "√") set(Math.sqrt(parseFloat(cur)));
    else if (t === "1/x") set(1/parseFloat(cur));
    else if (["+","-","*","/"].includes(t)){
      if (prev != null && op != null && !justOp) { const r = opMap[op](parseFloat(prev), parseFloat(cur)); set(r); prev = cur; }
      else prev = cur;
      op = t; justOp = true;
    }
    else if (t === "=" && prev != null && op != null) {
      set(opMap[op](parseFloat(prev), parseFloat(cur))); prev = null; op = null; justOp = true;
    }
  });
  makeWindow({ title:"Calculator", icon:ICONS.calc, w:280, h:300, resizable:false, content:c });
}

function appPaint(){
  const c = document.createElement("div");
  c.className = "paint";
  c.innerHTML = `
    <div class="tools">
      <div class="t active" data-tool="pencil">✏</div>
      <div class="t" data-tool="brush">🖌</div>
      <div class="t" data-tool="eraser">▭</div>
      <div class="t" data-tool="bucket">🪣</div>
      <div class="t" data-tool="line">╱</div>
      <div class="t" data-tool="rect">□</div>
      <div class="t" data-tool="circle">○</div>
      <div class="t" data-tool="clear">✕</div>
    </div>
    <div class="right-pane">
      <div class="canvas-wrap"><canvas width="520" height="320"></canvas></div>
      <div class="palette">
        <div class="current" id="curColor"></div>
        <div class="swatches"></div>
        <label style="font-size:10px;">Size <input type="range" id="brushSize" min="1" max="20" value="2" style="width:60px;"></label>
        <div style="flex:1"></div>
        <button class="btn" id="paintSave">Save</button>
      </div>
    </div>
  `;
  const cv = c.querySelector("canvas"); const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  const saved = localStorage.getItem("paint98"); if (saved){ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0); img.src=saved; }
  const palette = ["#000","#808080","#800000","#808000","#008000","#008080","#000080","#800080","#fff","#c0c0c0","#ff0000","#ffff00","#00ff00","#00ffff","#0000ff","#ff00ff"];
  const sw = c.querySelector(".swatches"); const cc = c.querySelector("#curColor");
  let color = "#000", tool = "pencil", brushSize = 2, snap=null, drawing=false, sx=0, sy=0;
  cc.style.background = color;
  palette.forEach((p,i) => {
    const d = document.createElement("div"); d.className="sw"+(i===0?" active":""); d.style.background=p;
    d.addEventListener("click", () => { color = p; cc.style.background = p; sw.querySelectorAll(".sw").forEach(x=>x.classList.remove("active")); d.classList.add("active"); });
    sw.appendChild(d);
  });
  c.querySelectorAll(".t").forEach(t => t.addEventListener("click", () => {
    c.querySelectorAll(".t").forEach(x => x.classList.remove("active"));
    t.classList.add("active"); tool = t.dataset.tool;
    if (tool === "clear") { ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); save(); }
  }));
  c.querySelector("#brushSize").addEventListener("input", e => brushSize = +e.target.value);
  c.querySelector("#paintSave").addEventListener("click", () => { const a=document.createElement("a"); a.href=cv.toDataURL(); a.download="painting.png"; a.click(); });
  function pos(e){ const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*(cv.width/r.width), (e.clientY-r.top)*(cv.height/r.height)]; }
  function save(){ try { localStorage.setItem("paint98", cv.toDataURL()); } catch(e){} }
  cv.addEventListener("pointerdown", e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    drawing = true; [sx,sy] = pos(e);
    ctx.strokeStyle = color; ctx.fillStyle = (tool==="eraser") ? "#fff" : color;
    ctx.lineWidth = brushSize; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (tool==="pencil"||tool==="brush"||tool==="eraser") { ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+0.1,sy+0.1); ctx.stroke(); }
    else if (tool==="bucket") { fill(ctx, sx|0, sy|0, color); save(); }
    else snap = ctx.getImageData(0,0,cv.width,cv.height);
  });
  cv.addEventListener("pointermove", e => {
    if (!drawing) return;
    const [x,y] = pos(e);
    if (tool==="pencil"||tool==="brush"){ ctx.lineTo(x,y); ctx.stroke(); }
    else if (tool==="eraser"){ ctx.fillRect(x-brushSize, y-brushSize, brushSize*2, brushSize*2); }
    else if (snap){
      ctx.putImageData(snap,0,0); ctx.beginPath();
      if (tool==="line"){ ctx.moveTo(sx,sy); ctx.lineTo(x,y); ctx.stroke(); }
      else if (tool==="rect") ctx.strokeRect(sx,sy,x-sx,y-sy);
      else if (tool==="circle"){ ctx.arc(sx,sy,Math.hypot(x-sx,y-sy),0,Math.PI*2); ctx.stroke(); }
    }
  });
  function end(){ if (drawing){ drawing=false; snap=null; save(); }}
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  makeWindow({ title:"untitled - Paint", icon:ICONS.paint, w:620, h:460, content:c });
}
function fill(ctx, x, y, color){
  const cv = ctx.canvas;
  const img = ctx.getImageData(0,0,cv.width,cv.height); const d = img.data;
  const i0 = (y*cv.width + x)*4; const tr=d[i0], tg=d[i0+1], tb=d[i0+2];
  const m = /^#([0-9a-f]{1,2})([0-9a-f]{1,2})([0-9a-f]{1,2})$/i.exec(color); if (!m) return;
  const exp = s => s.length===1 ? parseInt(s+s,16) : parseInt(s,16);
  const fr=exp(m[1]), fg=exp(m[2]), fb=exp(m[3]);
  if (tr===fr && tg===fg && tb===fb) return;
  const stack = [[x,y]];
  while (stack.length){
    const [cx,cy] = stack.pop();
    if (cx<0||cy<0||cx>=cv.width||cy>=cv.height) continue;
    const i=(cy*cv.width+cx)*4;
    if (d[i]!==tr||d[i+1]!==tg||d[i+2]!==tb) continue;
    d[i]=fr; d[i+1]=fg; d[i+2]=fb; d[i+3]=255;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  ctx.putImageData(img,0,0);
}

function appMines(){

    <div style="font-size:10px; margin-top:6px; text-align:center; color:#444;">${IS_TOUCH?"Tap = open · Long-press = flag":"Click = open · Right-click = flag"}</div>
  `;
  const grid = c.querySelector(".grid"); const face = c.querySelector("#mface");
  let board, opened, flags, over=false, won=false, started=false, timer=0, tHandle=null, flagCount=0;
  function newGame(){
    board = Array.from({length:H}, ()=>Array(W).fill(0));
    opened = Array.from({length:H}, ()=>Array(W).fill(false));
    flags = Array.from({length:H}, ()=>Array(W).fill(false));
    over=won=started=false; timer=0; flagCount=0;
    c.querySelector("#mc").textContent = String(MINES).padStart(3,"0"); c.querySelector("#mt").textContent = "000"; face.textContent = "🙂";
    if (tHandle) clearInterval(tHandle);
    let placed=0;
    while (placed<MINES){ const x=(Math.random()*W)|0, y=(Math.random()*H)|0; if (board[y][x]!==-1){ board[y][x]=-1; placed++; }}
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      if (board[y][x]===-1) continue;
      let n=0; for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){ const nx=x+dx,ny=y+dy; if (nx>=0&&nx<W&&ny>=0&&ny<H&&board[ny][nx]===-1) n++; }
      board[y][x]=n;
    }
    render();
  }
  function render(){
    grid.innerHTML="";
    for (let y=0;y<H;y++) for (let x=0;x<W;x++){
      const el = document.createElement("div"); el.className="cell";
      if (opened[y][x]){
        el.classList.add("opened");
        if (board[y][x]===-1){ el.textContent="💣"; if (over) el.classList.add("bomb"); }
        else if (board[y][x]>0){ el.textContent=board[y][x]; el.dataset.n=board[y][x]; }
      } else if (flags[y][x]) el.textContent="🚩";
      el.addEventListener("click", () => {
        if (over||won||flags[y][x]) return;
        if (!started){ started=true; tHandle=setInterval(()=>{ timer++; c.querySelector("#mt").textContent=String(Math.min(999,timer)).padStart(3,"0"); }, 1000); }
        openCell(x,y);
      });
      longPress(el, () => {
        if (over||won||opened[y][x]) return;
        flags[y][x]=!flags[y][x]; flagCount += flags[y][x]?1:-1;
        c.querySelector("#mc").textContent = String(Math.max(0,MINES-flagCount)).padStart(3,"0"); render();
      });
      grid.appendChild(el);
    }
  }
  function openCell(x,y){
    if (x<0||x>=W||y<0||y>=H||opened[y][x]) return;
    opened[y][x] = true;
    if (board[y][x]===-1){ over=true; face.textContent="😵"; clearInterval(tHandle); for (let yy=0;yy<H;yy++) for (let xx=0;xx<W;xx++) if (board[yy][xx]===-1) opened[yy][xx]=true; return render(); }
    if (board[y][x]===0) for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) if (dx||dy) openCell(x+dx,y+dy);
    let u=0; for (let yy=0;yy<H;yy++) for (let xx=0;xx<W;xx++) if (!opened[yy][xx]) u++;
    if (u===MINES){ won=true; face.textContent="😎"; clearInterval(tHandle); }
    render();
  }
  face.addEventListener("click", newGame);
  newGame();
  const wMines = makeWindow({ title:"Minesweeper", icon:ICONS.mines, w:210, h:300, resizable:false, content:c });
  wireMenubar(c.querySelector(".menubar"), {
    game: [

      { label:"About Minesweeper", action: ()=>aboutDialog("About","Minesweeper — Windows 98 Web") },
    ],
  });
}

// ---------- Snake ----------
function appSnake(){
  const c = document.createElement("div");
  c.className = "snake";
  c.innerHTML = `
    <div class="info">Score: <b id="snScore">0</b> · High: <b id="snHigh">${localStorage.getItem("snakeHigh98")||0}</b></div>
    <canvas width="280" height="280"></canvas>
    <div class="pad">
      <div class="blank"></div><button class="btn" data-dir="up">▲</button><div class="blank"></div>
      <button class="btn" data-dir="left">◀</button><button class="btn" data-dir="down">▼</button><button class="btn" data-dir="right">▶</button>
    </div>
    <div style="font-size:10px; color:#444;">Arrows / WASD / swipe</div>
  `;
  const cv = c.querySelector("canvas"), ctx = cv.getContext("2d");
  const G = 14, sz = 20;
  let snake, dir, nextDir, food, score, dead, loop;
  function reset(){
    snake = [[7,7],[6,7],[5,7]]; dir = [1,0]; nextDir=[1,0]; score=0; dead=false;
    spawn(); c.querySelector("#snScore").textContent="0";
    clearInterval(loop); loop = setInterval(step, 140);
  }
  function spawn(){ while (true){ const f=[(Math.random()*G)|0,(Math.random()*G)|0]; if (!snake.some(s=>s[0]===f[0]&&s[1]===f[1])){ food=f; return; }}}
  function step(){
    if (dead) return;
    dir = nextDir;
    const h = [snake[0][0]+dir[0], snake[0][1]+dir[1]];
    if (h[0]<0||h[0]>=G||h[1]<0||h[1]>=G||snake.some(s=>s[0]===h[0]&&s[1]===h[1])){ dead=true; clearInterval(loop); draw(); ding(); const hi=Math.max(score,+(localStorage.getItem("snakeHigh98")||0)); localStorage.setItem("snakeHigh98",hi); c.querySelector("#snHigh").textContent=hi; return; }
    snake.unshift(h);
    if (h[0]===food[0]&&h[1]===food[1]){ score++; c.querySelector("#snScore").textContent=score; spawn(); beep(660,0.05,"square",0.04); }
    else snake.pop();
    draw();
  }
  function draw(){
    ctx.fillStyle="#000"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle="#ff0000"; ctx.fillRect(food[0]*sz+2,food[1]*sz+2,sz-4,sz-4);
    snake.forEach((s,i) => { ctx.fillStyle = i===0?"#00ff00":"#00aa00"; ctx.fillRect(s[0]*sz+1,s[1]*sz+1,sz-2,sz-2); });
    if (dead){ ctx.fillStyle="rgba(0,0,0,0.7)"; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle="#fff"; ctx.font="bold 20px Tahoma"; ctx.textAlign="center"; ctx.fillText("GAME OVER", cv.width/2, cv.height/2-6); ctx.font="11px Tahoma"; ctx.fillText("Press a direction to restart", cv.width/2, cv.height/2+16); }
  }
  function setDir(d){
    if (dead){ reset(); return; }
    if (d==="up" && dir[1]!==1) nextDir=[0,-1];
    if (d==="down" && dir[1]!==-1) nextDir=[0,1];
    if (d==="left" && dir[0]!==1) nextDir=[-1,0];
    if (d==="right" && dir[0]!==-1) nextDir=[1,0];
  }
  c.addEventListener("click", e => { const b = e.target.closest("[data-dir]"); if (b) setDir(b.dataset.dir); });
  function key(e){ const k=e.key.toLowerCase(); const m={arrowup:"up",arrowdown:"down",arrowleft:"left",arrowright:"right",w:"up",s:"down",a:"left",d:"right"}; if (m[k]){ e.preventDefault(); setDir(m[k]); }}
  window.addEventListener("keydown", key);
  let sx=0,sy=0;
  cv.addEventListener("pointerdown", e => { sx=e.clientX; sy=e.clientY; });
  cv.addEventListener("pointerup", e => {
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if (Math.abs(dx)<20&&Math.abs(dy)<20) return;
    if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?"right":"left"); else setDir(dy>0?"down":"up");
  });
  reset(); draw();
  makeWindow({ title:"Snake", icon:ICONS.snake, w:320, h:480, resizable:false, content:c });
}

function appTerminal(cmdMode){
  const c = document.createElement("div");
  c.className = "term";
  c.tabIndex = 0;

  let mode = cmdMode ? "cmd" : "ps";
  let cwd = "/home/khaled";
  const fs = loadFS();
  const history = []; let hi = -1;

  function banner(){
    if (mode === "wsl")
      return `<span class="ok">Welcome to Ubuntu 22.04 LTS (WSL on Windows 98 Web)</span>\n<span style="color:#888;">Type <b>help</b> for commands. Type <b>exit</b> to return to Windows.</span>\n\n`;
    if (mode === "cmd")
      return `Microsoft(R) Windows 98\n   (C)Copyright Microsoft Corp 1981-1999.\n\n`;
    return `<span class="ok">Windows PowerShell (Web)</span>\n<span style="color:#888;">Copyright (C) Microsoft Corporation. All rights reserved.</span>\nType <b>wsl</b> to enter Linux, <b>help</b> for commands.\n\n`;
  }
  function prompt(){
    if (mode === "wsl") return `<span style="color:#5fff5f;">khaled@WIN98</span>:<span style="color:#5f87ff;">${cwd.replace("/home/khaled","~")}</span>$ `;
    if (mode === "cmd") return `<span class="prompt">C:\\WINDOWS&gt;</span> `;
    return `<span class="prompt">PS C:\\Users\\Khaled&gt;</span> `;
  }
  c.innerHTML = `<div class="line">${banner()}</div><div class="cur">${prompt()}<input class="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>`;
  let cur = c.querySelector(".cur");

  function append(html){ const ln=document.createElement("div"); ln.className="line"; ln.innerHTML=html; c.insertBefore(ln,cur); c.scrollTop=c.scrollHeight; }
  function reprompt(){
    cur.remove();
    const n = document.createElement("div"); n.className="cur";
    n.innerHTML = `${prompt()}<input class="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
    c.appendChild(n); cur = n; bind();
    setTimeout(()=>n.querySelector("input").focus(),0);
    c.scrollTop = c.scrollHeight;
  }
  function bind(){
    const inp = cur.querySelector("input");
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const cmd = inp.value;
        if (cmd.trim()) { history.push(cmd); hi = history.length; }
        append(`${prompt()}${escHtml(cmd)}`);
        run(cmd); reprompt();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (hi > 0) { hi--; inp.value = history[hi]; }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (hi < history.length-1) { hi++; inp.value = history[hi]; }
        else { hi = history.length; inp.value = ""; }
      } else if (e.key === "l" && e.ctrlKey) {
        e.preventDefault(); c.querySelectorAll(".line").forEach(l => l.remove());
      } else if (e.key === "c" && e.ctrlKey && !inp.selectionEnd) {
        e.preventDefault(); append("^C"); inp.value = "";
      }
    });
    inp.addEventListener("paste", e => {
      const txt = (e.clipboardData || window.clipboardData).getData("text");
      if (!txt) return;
      e.preventDefault();
      const start = inp.selectionStart, end = inp.selectionEnd;
      inp.value = inp.value.slice(0,start) + txt + inp.value.slice(end);
      inp.selectionStart = inp.selectionEnd = start + txt.length;
    });
  }

  // Right-click → copy/paste menu (classic Windows console behavior)
  c.addEventListener("contextmenu", e => {
    e.preventDefault();
    const sel = window.getSelection()?.toString() || "";
    showCtx(e.clientX, e.clientY, [
      { label:"Copy", disabled:!sel, action: async () => { try { await navigator.clipboard.writeText(sel); toast("Copied"); } catch { document.execCommand("copy"); toast("Copied"); } } },
      { label:"Paste", action: async () => {
        let t = ""; try { t = await navigator.clipboard.readText(); } catch { t = prompt("Paste:") || ""; }
        const inp = cur.querySelector("input"); if (!inp) return;
        inp.focus(); const s=inp.selectionStart||inp.value.length, e=inp.selectionEnd||s;
        inp.value = inp.value.slice(0,s) + t + inp.value.slice(e);
        inp.selectionStart = inp.selectionEnd = s + t.length;
      }},
      { label:"Select All", action: () => { const r = document.createRange(); r.selectNodeContents(c); window.getSelection().removeAllRanges(); window.getSelection().addRange(r); } },
      { sep:true },
      { label:"Clear", action: () => c.querySelectorAll(".line").forEach(l => l.remove()) },
    ]);
  });

  // ====== Command implementations ======
  function resolve(p){
    if (!p) return cwd;
    if (p === "~") return "/home/khaled";
    if (p.startsWith("~/")) p = "/home/khaled/" + p.slice(2);
    const parts = (p.startsWith("/") ? p : cwd + "/" + p).split("/").filter(Boolean);
    const stack = [];
    for (const part of parts) {
      if (part === ".") continue;
      if (part === "..") stack.pop();
      else stack.push(part);
    }
    return "/" + stack.join("/");
  }
  function node(path){ return fs[path === "" ? "/" : path]; }

  function run(cmd){
    const raw = cmd.trim(); if (!raw) return;
    const low = raw.toLowerCase();

    // Mode switches work in all modes
    if (low === "wsl" || low === "bash" || low === "ubuntu") { mode = "wsl"; cwd = "/home/khaled"; append(banner()); return; }
    if (mode === "wsl" && (low === "cmd" || low === "exit.windows")) { mode = "cmd"; append("logout"); return; }

    if (mode === "wsl") return runLinux(raw);
    return runDOS(raw);
  }

  function runDOS(cmd){
    const c2 = cmd.toLowerCase();
    if (c2 === "help" || c2 === "?") {
      append("Built-in DOS commands:\n  help, dir, cd, cls, clear, date, time, ver, echo, type, ipconfig, whoami, exit\n  wsl              Enter Linux shell\nApps you can launch:\n  notepad, calc, paint, edge, chrome, mines, snake, java, rar, cmd, terminal\nSystem:\n  shutdown");
    } else if (c2 === "dir") {
      append(`<span class="ok"> Volume in drive C is WIN98\n Volume Serial Number is 1A2B-3C4D\n\n Directory of C:\\WINDOWS\n\nWelcome.txt  My Pictures/  Documents/  Notes.txt  cmd.com</span>`);
    } else if (c2 === "cls" || c2 === "clear") {
      c.querySelectorAll(".line").forEach(l => l.remove());
    } else if (c2 === "date") append(new Date().toDateString());
    else if (c2 === "time") append(new Date().toLocaleTimeString());
    else if (c2 === "ver") append("Windows 98 [Version 4.10.1998]");
    else if (c2 === "whoami") append("KHALED\\KhaledQ84Ever");
    else if (c2.startsWith("echo ")) append(escHtml(cmd.slice(5)));
    else if (c2 === "ipconfig") append("Ethernet adapter Local Area Connection:\n   IP Address. . . . . : 192.168.1.100\n   Subnet Mask . . . . : 255.255.255.0\n   Default Gateway . . : 192.168.1.1");
    else if (c2 === "exit" || c2 === "shutdown") shutdown();
    else if (APPS[c2]) openApp(c2);
    else append(`<span class="err">Bad command or file name: '${escHtml(cmd)}'</span>`);
  }

  async function runLinux(cmd){
    // very small shell — supports: pipes ignored, basic redirect for echo > file
    const parts = cmd.match(/(?:[^\s"]+|"[^"]*")+/g).map(x => x.replace(/^"|"$/g,""));
    const a0 = parts[0], args = parts.slice(1);

    const cmds = {
      help: () => append(`Built-in commands:
  ls [-a/-l] [path]        list directory
  pwd                      print working directory
  cd [path]                change directory
  cat [file]               show file
  echo [text] [> file]     print or write text
  touch [file]             create empty file
  mkdir [dir]              create directory
  rm [file/dir]            delete
  whoami / hostname        identity
  uname [-a]               system info
  date                     current date
  history                  command history
  clear                    clear screen
  neofetch                 system info banner
  ps                       processes (fake)
  apt / sudo               package manager (fake)
  exit / logout            return to Windows`),
      ls: () => {
        let path = cwd, showAll = false, long = false;
